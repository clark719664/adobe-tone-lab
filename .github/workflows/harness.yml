name: Benchmark harness and unchanged PhotoCraft tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  harness:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s . -v
      - run: python run_photocraft.py --build-dir work/build
      - name: Missing joint references must remain an explicit unavailable result
        shell: pwsh
        run: |
          python benchmark.py joint-gate work/real-adobe-exports
          if ($LASTEXITCODE -ne 2) { throw 'Expected absent joint oracle (exit 2).' }
          exit 0
